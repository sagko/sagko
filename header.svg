<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="SAGIZ. Human curiosity. Machine velocity.">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#163829" stroke-width=".7"/></pattern><linearGradient id="fade"><stop stop-color="#06150e"/><stop offset="1" stop-color="#090d12"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
<rect width="1200" height="380" rx="20" fill="url(#fade)"/><rect width="1200" height="380" rx="20" fill="url(#grid)"/>
<g fill="none" stroke="#50ffad"><circle cx="1000" cy="190" r="110" opacity=".2"/><circle cx="1000" cy="190" r="85" stroke-dasharray="90 30 10 30" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="0 1000 190" to="360 1000 190" dur="24s" repeatCount="indefinite"/></circle><path d="M950 190h100m-50-50v100" opacity=".4"/></g>
<rect x="0" y="0" width="1200" height="2" fill="#50ffad" opacity=".2"><animate attributeName="y" values="0;380" dur="7s" repeatCount="indefinite"/></rect>
