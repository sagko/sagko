<text x="66" y="206" fill="#50ffad" font-family="Arial,sans-serif" font-size="110" font-weight="900" letter-spacing="10" filter="url(#glow)" opacity=".25">SAGIZ</text>
<text x="66" y="206" fill="#e9fff4" font-family="Arial,sans-serif" font-size="110" font-weight="900" letter-spacing="10">SAGIZ</text>
<text x="72" y="263" fill="#9eb9ad" font-family="monospace" font-size="22">Human curiosity. Machine velocity.</text>
<rect x="72" y="305" width="42" height="4" fill="#50ffad"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></rect>
</svg>

